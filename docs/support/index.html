<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Wimya support.">
  <title>Wimya Support</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f7ff;
      --surface: #ffffff;
      --text: #172033;
      --muted: #626b7b;
      --accent: #3157d5;
      --border: #dfe5f0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top, #e5ebff 0, var(--background) 42%);
      color: var(--text);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(600px, 100%);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 55px rgba(35, 52, 91, .12);
    }

    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: #e9eeff;
      color: var(--accent);
      font-size: 30px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.1;
      letter-spacing: -.035em;
    }

    p { margin: 0 auto; color: var(--muted); }

    .email {
      display: inline-block;
      margin: 28px 0 12px;
      padding: 13px 22px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }

    .email:hover { background: #2547bc; }
    .email:focus-visible, button:focus-visible { outline: 3px solid #8eabff; outline-offset: 3px; }

    .note { font-size: .92rem; }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
    }

    button {
      padding: 9px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: .9rem;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); color: var(--accent); }

    @media print {
      body { min-height: auto; padding: 0; background: #fff; }
      main { width: 100%; border: 0; box-shadow: none; }
      .actions { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✉</div>
    <p class="eyebrow">Wimya</p>
    <h1>How can we help?</h1>
    <p>For questions, account help, or technical support, email the Wimya support team.</p>
    <a class="email" href="mailto:runtimesquad@gmail.com">runtimesquad@gmail.com</a>
    <p class="note">We’ll respond as soon as we can.</p>
  </main>

  <script>
    function downloadPage() {
      const source = "<!doctype html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([source], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "wimya-support.html";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
